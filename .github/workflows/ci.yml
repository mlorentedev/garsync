name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege at the workflow level: every job here reads the repository and
# nothing else. Release and Pages need more, and they declare it on the job that
# actually needs it (release.yml, docs.yml) — never on the whole workflow.
permissions:
  contents: read

# One run per ref, and a push that supersedes an in-flight run cancels the
# superseded one: the verdict that matters is always the newest commit's, and
# letting stale runs queue behind it only delays the answer.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
        with:
          version: latest
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache virtualenv
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-interaction

      # `make check-backend` (lint + type + the coverage ratchet) is the single
      # definition of the backend gate. This workflow deliberately does not
      # restate the individual commands: a gate written twice is a gate that will
      # disagree with itself, and the copy in CI is the one nobody notices drifting.
      - name: Backend gate
        run: make check-backend

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Frontend gate
        run: make frontend-check
