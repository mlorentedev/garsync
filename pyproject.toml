[project]
name = "garsync"
version = "0.1.5"
description = ""
authors = [
    {name = "Manu",email = "mlorentedev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "garminconnect (>=0.3.10,<0.4.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "tenacity (>=9.1.4,<10.0.0)",
    "typer (>=0.27.1,<0.28.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pandas (<4)",
    "streamlit (>=1.61.1,<2.0.0)",
    "plotly (>=6.9.0,<7.0.0)",
    "fastapi (>=0.141.1,<1.0.0)",
    "uvicorn[standard] (>=0.52.2,<1.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
garsync = "garsync.cli:app"

[dependency-groups]
dev = [
    "typer (>=0.27.1,<0.28.0)",
    "rich (>=15.0.0,<16.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "mypy (>=2.3.0,<3.0.0)",
    "ruff (>=0.16.3,<0.17.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "httpx (>=0.28.1,<1.0.0)"
]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = "garminconnect.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "garsync.client"
disallow_untyped_calls = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
