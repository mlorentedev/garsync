# Alembic configuration.
#
# `sqlalchemy.url` is deliberately absent. This chain runs on the connection the application
# already holds (see `src/garsync/db/migrations/env.py`), because a connection Alembic opens for
# itself is a *different* database from the caller's — which, for the `:memory:` fixtures this
# suite builds, means an empty one. `script_location` is set in code as well, so `init_db` does not
# depend on this file being found from whatever directory the process started in.
[alembic]
script_location = src/garsync/db/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
